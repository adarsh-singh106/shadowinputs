[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowinputs"
version = "0.1.0"
description = "Local AI-assisted review and integrity checks for deployment inputs"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "ShadowInputs contributors"}]
readme = "README.md"

[project.scripts]
shadowinputs = "shadowinputs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["shadowinputs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
